apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: observability-demo
  labels:
    app.kubernetes.io/part-of: observability-demo
    app.kubernetes.io/component: configuration
data:
  # --- Direct export to Azure Application Insights ---
  APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=1f3a1dfd-cf0b-4111-92ed-b118098b25b9;IngestionEndpoint=https://eastus-8.in.applicationinsights.azure.com/;LiveEndpoint=https://eastus.livediagnostics.monitor.azure.com/;ApplicationId=5ff27e9e-11e1-4c74-9395-15ee64f5cffd"

  # --- REMOVE or COMMENT OUT this line (no OTEL Collector deployed) ---
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability-demo.svc.cluster.local:4318"

  # --- Trace/Metric/Log exporters ---
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"

  # --- Context propagation ---
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # --- Resource attributes (added to all telemetry) ---
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production,k8s.cluster.name=aks-demo"

  # --- Log level ---
  LOG_LEVEL: "info"
