# ============================================================
# Order Service Deployment — 🔧 Admin/DevOps responsibility
# ============================================================
# BRANCH: feature2_AMA
# Uses Azure Monitor native instrumentation instead of OTEL Collector
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: observability-demo
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: observability-demo
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
      annotations:
        # Prometheus scrape annotations (if using Prometheus ServiceMonitor)
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: order-service
          # Replace with your ACR image path:
          # image: <your-acr>.azurecr.io/order-service:ama-v1
          image: ameldocker98/order-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          # --- Environment Variables ---
          env:
            - name: PORT
              value: "3000"
            # Azure Monitor Application Insights
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app-insights-connection
                  key: connection-string
            - name: APPLICATIONINSIGHTS_ROLE_NAME
              value: "order-service"
            # Service URLs
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service.observability-demo.svc.cluster.local:8080"
            - name: SHIPPING_SERVICE_URL
              value: "http://shipping-service.shipping-system.svc.cluster.local:5000"
            - name: RECOMMENDATION_SERVICE_URL
              value: "http://recommendation-service.analytics-system.svc.cluster.local:6000"
            - name: NODE_ENV
              value: "production"
          # --- Health Probes (using health endpoint from developers) ---
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # --- Resource Limits ---
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
