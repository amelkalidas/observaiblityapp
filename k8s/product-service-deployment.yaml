# ============================================================
# Product Service Deployment — 🔧 Admin/DevOps responsibility
# ============================================================
# BRANCH: feature2_AMA
# Uses Azure Monitor native instrumentation instead of OTEL Collector
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: observability-demo
  labels:
    app: product-service
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: observability-demo
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        app.kubernetes.io/name: product-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: product-service
          # Replace with your ACR image path:
          # image: <your-acr>.azurecr.io/product-service:ama-v1
          image: ameldocker98/product-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          # --- Environment Variables ---
          env:
            # Azure Monitor Application Insights
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: app-insights-connection
                  key: connection-string
            - name: APPLICATIONINSIGHTS_ROLE_NAME
              value: "product-service"
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx256m"
          # --- Health Probes (using Spring Actuator endpoint from developers) ---
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Startup probe — Java apps take longer to start
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          # --- Resource Limits ---
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
